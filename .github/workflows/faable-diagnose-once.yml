name: DIZA Faable runtime diagnose once

on:
  push:
    branches:
      - faable-diagnose-20261002
    paths:
      - ".github/workflows/faable-diagnose-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: Faable status
        run: faable deploy status || true
      - name: Faable deployments
        run: faable deploy deployments || true
      - name: Inspect final warmup deployment
        run: faable deploy inspect deployment_6abf3038508116fe2b1e8bf6 || true
      - name: Final deployment runtime log
        run: faable deploy logs -d deployment_6abf3038508116fe2b1e8bf6 || true
      - name: Final deployment raw inspect
        run: faable deploy inspect deployment_6abf3038508116fe2b1e8bf6 --json || true
      - name: Inspect Codex-only deployment
        run: faable deploy inspect deployment_6abf31fb57484ffe7f8ee8fa --json || true
      - name: Codex-only deployment runtime log
        run: faable deploy logs -d deployment_6abf31fb57484ffe7f8ee8fa || true
      - name: Latest build log
        run: faable deploy logs --build || true
      - name: Public endpoint probe
        shell: bash
        run: |
          set +e
          echo "=== DNS ==="
          getent ahosts diza-bot-5eoll.faable.link || true
          echo "=== HEALTH ==="
          curl -vk --connect-timeout 10 --max-time 20 https://diza-bot-5eoll.faable.link/healthz -o /tmp/faable-health.txt
          echo "curl_health_exit=$?"
          cat /tmp/faable-health.txt 2>/dev/null || true
          echo
          echo "=== ROOT HEADERS ==="
          curl -vkI --connect-timeout 10 --max-time 20 https://diza-bot-5eoll.faable.link/
          echo "curl_root_exit=$?"
      - name: Live runtime log
        run: faable deploy logs || true

