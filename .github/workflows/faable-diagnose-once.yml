name: DIZA Faable runtime diagnose once

on:
  push:
    branches:
      - faable-diagnose-20261002
    paths:
      - ".github/workflows/faable-diagnose-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: Faable status
        run: faable deploy status || true
      - name: Faable deployments
        run: faable deploy deployments || true
      - name: Latest build log
        run: faable deploy logs --build || true
      - name: Live runtime log
        run: faable deploy logs || true

