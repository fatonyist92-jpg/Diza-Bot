name: DIZA Faable quick status

on:
  push:
    branches:
      - faable-diagnose-20261002
    paths:
      - ".github/workflows/faable-quick-status.yml"

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: Status
        run: faable deploy status || true
      - name: Deployments
        run: faable deploy deployments || true
      - name: Runtime logs
        run: faable deploy logs || true
