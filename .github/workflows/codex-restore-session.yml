name: DIZA Codex restore session
# direct device login after Faable READY

on:
  push:
    branches:
      - restore-faable-codex-lock-20261003
    paths:
      - ".github/workflows/codex-restore-session.yml"

permissions:
  contents: read

jobs:
  start-codex-login:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Start Codex ChatGPT device login
        env:
          LIVE_URL: https://diza-bot-5eoll.faable.link
        run: |
          node <<'NODE'
          const base = process.env.LIVE_URL;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(path, init = {}, timeoutMs = 60000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const response = await fetch(base + path, {
                ...init,
                signal: controller.signal,
                headers: {
                  accept: "application/json",
                  ...(init.body ? { "content-type": "application/json" } : {}),
                  ...(init.headers || {}),
                },
              });
              const text = await response.text();
              let body = null;
              try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 300) }; }
              return { status: response.status, body };
            } finally {
              clearTimeout(timer);
            }
          }

          let healthy = false;
          for (let attempt = 1; attempt <= 36; attempt++) {
            try {
              const health = await request("/healthz", {}, 15000);
              if (
                health.status === 200 &&
                health.body?.ok === true &&
                health.body?.persistence?.enabled === true &&
                health.body?.persistence?.ready === true
              ) {
                healthy = true;
                console.log("LIVE_PERSISTENCE_READY");
                break;
              }
            } catch {}
            await sleep(5000);
          }
          if (!healthy) throw new Error("Faable live persistence did not become ready");

          try {
            const config = await request("/api/config", {}, 30000);
            console.log("CURRENT_ENGINE=" + JSON.stringify(config.body?.engine ?? null));
          } catch (error) {
            console.log("CURRENT_ENGINE_CHECK_SKIPPED=" + (error instanceof Error ? error.message : String(error)));
          }

          const started = await request("/api/providers/codex/login", { method: "POST", body: "{}" }, 90000);
          if (started.status !== 200) {
            throw new Error("Codex login start failed HTTP " + started.status + ": " + JSON.stringify(started.body));
          }
          if (started.body?.status === "connected") {
            console.log("CODEX_ALREADY_CONNECTED");
            process.exit(0);
          }
          if (
            started.body?.status !== "pending" ||
            typeof started.body?.verificationUrl !== "string" ||
            typeof started.body?.userCode !== "string"
          ) {
            throw new Error("Codex did not return a device challenge: " + JSON.stringify(started.body));
          }
          console.log("CODEX_VERIFY_URL=" + started.body.verificationUrl);
          console.log("CODEX_USER_CODE=" + started.body.userCode);
          console.log("CODEX_LOGIN_PENDING");
          NODE
