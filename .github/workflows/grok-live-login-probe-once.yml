name: DIZA Grok live login and E2E once

on:
  push:
    branches:
      - live-test-bab14
    paths:
      - ".github/workflows/grok-live-login-probe-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest

      - name: Wait for this Faable release
        shell: bash
        run: |
          set -euo pipefail
          wanted="${GITHUB_SHA:0:7}"
          for i in $(seq 1 120); do
            out="$(faable deploy status 2>&1 || true)"
            deployments="$(faable deploy deployments 2>&1 || true)"
            echo "$out"
            echo "$deployments"
            if echo "$out" | grep -q "READY" && echo "$deployments" | grep -E "READY.*${wanted}.*live"; then
              exit 0
            fi
            sleep 5
          done
          echo "This commit did not become the READY live deployment in time" >&2
          exit 1

      - name: Start Grok account device login
        shell: bash
        run: |
          set -euo pipefail
          base="https://diza-bot-5eoll.faable.link"
          curl -fsS "$base/healthz"
          echo
          response="$(curl -fsS -X POST "$base/api/providers/grokCli/login" -H 'content-type: application/json' --data '{}')"
          printf '%s' "$response" > /tmp/grok-login.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const x = JSON.parse(fs.readFileSync("/tmp/grok-login.json","utf8"));
          console.log("GROK_LOGIN_STATUS=" + String(x.status ?? ""));
          if (x.verificationUrl) console.log("GROK_VERIFICATION_URL_AVAILABLE=1");
          if (x.userCode) console.log("GROK_USER_CODE_AVAILABLE=1");
          if (x.error) console.log("GROK_LOGIN_ERROR=" + x.error);
          if (x.status !== "pending" && x.status !== "connected") process.exitCode = 2;
          NODE

      - name: Store private Grok login challenge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-login-challenge
          path: /tmp/grok-login.json
          retention-days: 1
          if-no-files-found: warn

      - name: Wait for Grok login completion
        shell: bash
        run: |
          set -euo pipefail
          base="https://diza-bot-5eoll.faable.link"
          for i in $(seq 1 180); do
            response="$(curl -fsS "$base/api/providers/grokCli/login")"
            printf '%s' "$response" > /tmp/grok-status.json
            status="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/grok-status.json','utf8')).status")"
            echo "GROK_LOGIN_POLL=$status"
            if [ "$status" = "connected" ]; then
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/grok-status.json','utf8')); console.log('GROK_LOGIN_ERROR='+(x.error||'unknown'))"
              exit 1
            fi
            sleep 5
          done
          echo "GROK_LOGIN_TIMEOUT=1"
          exit 1

      - name: Verify Grok authenticated instance
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://diza-bot-5eoll.faable.link/api/instances" >/tmp/instances.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const x = JSON.parse(fs.readFileSync("/tmp/instances.json","utf8"));
          const grok = x.instances?.find((i) => i.driverKind === "grokCli");
          if (!grok) throw new Error("Grok CLI instance missing");
          if (grok.snapshot?.state !== "available") throw new Error("Grok CLI unavailable");
          if (grok.snapshot?.authenticated !== true) throw new Error("Grok CLI is not authenticated");
          console.log("GROK_AUTHENTICATED=1");
          console.log("GROK_RUNTIME=" + String(grok.snapshot?.version ?? ""));
          NODE

      - name: Grok end-to-end DIZA turn
        shell: bash
        run: |
          set -euo pipefail
          base="https://diza-bot-5eoll.faable.link"
          created="$(curl -fsS -X POST "$base/api/bots" -H 'content-type: application/json' --data '{}')"
          printf '%s' "$created" >/tmp/grok-bot.json
          bot="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/grok-bot.json','utf8')).bot.id")"
          cleanup() { curl -fsS -X DELETE "$base/api/bots/$bot?forget=1" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          model="$(curl -fsS "$base/api/instances" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s); const g=x.instances.find(i=>i.driverKind==="grokCli");
              process.stdout.write(g?.models?.default || "grok-4.6");
            });')"
          curl -fsS -X PATCH "$base/api/bots/$bot" -H 'content-type: application/json' \
            --data "$(node -e 'process.stdout.write(JSON.stringify({modelSelection:{instanceId:"grok_cli",model:process.argv[1]}}))' "$model")" >/tmp/grok-patch.json

          before="$(curl -fsS "$base/api/bots?messages=20")"
          printf '%s' "$before" >/tmp/grok-before.json
          curl -fsS -X POST "$base/api/bots/$bot/messages" -H 'content-type: application/json' \
            --data '{"text":"Reply with exactly: GROK_DIZA_LIVE_OK"}' >/tmp/grok-send.json

          for i in $(seq 1 90); do
            sleep 2
            curl -fsS "$base/api/bots?messages=60" >/tmp/grok-latest.json
            if BOT_ID="$bot" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const x=JSON.parse(fs.readFileSync("/tmp/grok-latest.json","utf8"));
          const b=x.bots?.find(v=>v.id===process.env.BOT_ID);
          const reply=(b?.messages ?? []).find(m=>m.role==="bot" && m.kind==="text" && String(m.text ?? "").includes("GROK_DIZA_LIVE_OK"));
          if (!reply) process.exit(1);
          console.log("GROK_DIZA_E2E_PASS=1");
          console.log("GROK_REPLY=" + String(reply.text).slice(0,160));
          NODE
            then exit 0; fi
          done
          echo "GROK_DIZA_E2E_TIMEOUT=1"
          exit 1
