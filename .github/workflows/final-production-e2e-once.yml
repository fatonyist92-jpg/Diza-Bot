name: DIZA final production E2E once

on:
  push:
    branches:
      - migration-vercel-supabase
    paths:
      - ".github/workflows/final-production-e2e-once.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production behavior
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://diza-bot.vercel.app";
          let botId = "";
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const call = async (path, init = {}, ok = [200, 201, 202]) => {
            const res = await fetch(base + path, init);
            const text = await res.text();
            let body = {};
            try { body = JSON.parse(text); } catch { body = { text }; }
            if (!ok.includes(res.status)) {
              throw new Error(`${init.method ?? "GET"} ${path} -> ${res.status}: ${text.slice(0,700)}`);
            }
            return { res, body, text };
          };
          const bots = async (messages = 50) => {
            let last;
            for (let attempt = 0; attempt < 5; attempt++) {
              try { return (await call(`/api/bots?messages=${messages}`)).body.bots ?? []; }
              catch (e) { last = e; await sleep(450 * (attempt + 1)); }
            }
            throw last;
          };
          try {
            const config0 = (await call("/api/config")).body;
            if (config0?.engine?.instanceId !== "openrouter") throw new Error("production global engine is not OpenRouter");

            // Invalid legacy/global selections must fail closed and leave config unchanged.
            const bad = await fetch(base + "/api/config", {
              method: "PUT",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ engine: { instanceId: "__missing_engine__", model: "__missing_model__" } }),
            });
            if (bad.status !== 400) throw new Error(`invalid global engine was not rejected: ${bad.status}`);
            const config1 = (await call("/api/config")).body;
            if (JSON.stringify(config1.engine) !== JSON.stringify(config0.engine)) {
              throw new Error("invalid engine request mutated production config");
            }

            const made = await call("/api/bots", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                name: "__diza_final_e2e__",
                title: "Temporary verification",
                description: "For explicit UI verification requests, follow the user's instruction to call ask_user when asked.",
              }),
            });
            botId = made.body?.bot?.id ?? "";
            if (!botId) throw new Error("temporary bot was not created");
            if (made.body.bot.modelSelection?.instanceId !== config0.engine.instanceId) {
              throw new Error("new bot did not inherit workspace engine");
            }

            // Avatar bytes + state must round-trip through Vercel.
            const png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z0V8AAAAASUVORK5CYII=";
            const avatar = await call(`/api/bots/${botId}/avatar`, {
              method: "PUT",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ mime: "image/png", data: png }),
            });
            if (!avatar.body?.bot?.avatarAt) throw new Error("avatar mutation did not return avatarAt");
            const avatarGet = await fetch(base + `/api/bots/${botId}/avatar?v=${avatar.body.bot.avatarAt}`);
            if (!avatarGet.ok || !String(avatarGet.headers.get("content-type") ?? "").startsWith("image/png")) {
              throw new Error("avatar bytes did not round-trip");
            }

            // Normal streamed inference must settle and persist.
            const before = new Set((made.body.bot.messages ?? []).map((m) => m.id));
            const streamed = await fetch(base + `/api/bots/${botId}/messages`, {
              method: "POST",
              headers: { "content-type": "application/json", accept: "text/event-stream" },
              body: JSON.stringify({
                text: "Reply with exactly DIZA_FINAL_CHAT_OK and nothing else. Do not call tools.",
                mode: "auto",
              }),
            });
            const wire = await streamed.text();
            if (!streamed.ok) throw new Error(`streamed chat failed ${streamed.status}: ${wire.slice(0,700)}`);
            if (/request\.error/.test(wire)) throw new Error("stream carried request.error: " + wire.slice(-700));

            let stateBot;
            for (let attempt = 0; attempt < 8; attempt++) {
              stateBot = (await bots()).find((b) => b.id === botId);
              const reply = (stateBot?.messages ?? []).find((m) =>
                !before.has(m.id) && m.role === "bot" && m.kind === "text" &&
                String(m.text ?? "").includes("DIZA_FINAL_CHAT_OK")
              );
              if (reply && !stateBot?.busy) break;
              await sleep(800);
            }
            if (!stateBot || stateBot.busy) throw new Error("normal chat remained busy");
            if (!(stateBot.messages ?? []).some((m) => String(m.text ?? "").includes("DIZA_FINAL_CHAT_OK"))) {
              throw new Error("normal streamed reply was not persisted");
            }
            if (!stateBot.avatarAt) throw new Error("avatarAt disappeared after chat hydration");

            // Ask-user semantic test. The production model has already used
            // this tool in DIZA; make the request explicit and verify an
            // Allow/Deny *question* cannot turn into a permission decision.
            const askPost = await fetch(base + `/api/bots/${botId}/messages`, {
              method: "POST",
              headers: { "content-type": "application/json", accept: "text/event-stream" },
              body: JSON.stringify({
                text: "For this verification, call the ask_user tool now. Ask exactly: FINAL QUESTION? Give exactly two choices: Allow and Deny. Do not answer the question yourself before the tool result.",
                mode: "auto",
              }),
            });
            const askWirePromise = askPost.text();

            let question = null;
            for (let attempt = 0; attempt < 18; attempt++) {
              const current = (await bots()).find((b) => b.id === botId);
              question = (current?.messages ?? []).find((m) =>
                m.kind === "options" && m.card?.requestId &&
                String(m.card?.subtitle ?? "").includes("FINAL QUESTION?")
              ) ?? null;
              if (question) break;
              await sleep(900);
            }
            if (!question) {
              const askWire = await Promise.race([askWirePromise, sleep(3000).then(() => "")]);
              throw new Error("model did not surface the requested ask_user card: " + String(askWire).slice(-500));
            }
            if (question.card.requestType !== "question") {
              throw new Error("ask_user card was not typed as question");
            }
            if (question.card.tool) throw new Error("question card incorrectly carried permission tool metadata");
            if (JSON.stringify(question.card.options) !== JSON.stringify(["Allow","Deny"])) {
              throw new Error("question options changed: " + JSON.stringify(question.card.options));
            }

            const answered = await call(`/api/bots/${botId}/respond`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                requestId: question.card.requestId,
                behavior: "answer",
                message: "Allow",
              }),
            });
            if (answered.body?.outcome !== "delivered") throw new Error("question response was not delivered");

            let settled = null;
            for (let attempt = 0; attempt < 12; attempt++) {
              const current = (await bots()).find((b) => b.id === botId);
              settled = (current?.messages ?? []).find((m) => m.id === question.id) ?? null;
              if (settled?.card?.answered === "Allow") break;
              await sleep(700);
            }
            if (settled?.card?.answered !== "Allow") {
              throw new Error("question stored internal behavior instead of actual answer: " + JSON.stringify(settled?.card));
            }

            await Promise.race([askWirePromise, sleep(8000)]);
            const finalBot = (await bots()).find((b) => b.id === botId);
            if (!finalBot || finalBot.busy) throw new Error("question turn did not settle");
            if (!finalBot.avatarAt) throw new Error("avatar disappeared after question flow");

            console.log("DIZA_FINAL_E2E_PASS=1");
            console.log("GLOBAL_ENGINE=" + config0.engine.instanceId + "/" + config0.engine.model);
            console.log("CHAT_STREAM_PERSISTED=1");
            console.log("QUESTION_SEMANTICS=1");
            console.log("AVATAR_ROUNDTRIP=1");
          } finally {
            if (botId) {
              try { await fetch(base + `/api/bots/${botId}?forget=1`, { method: "DELETE" }); } catch {}
            }
          }
          NODE
