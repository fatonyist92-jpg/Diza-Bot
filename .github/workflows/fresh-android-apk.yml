name: Fresh Diza Android APK

on:
  push:
    branches:
      - fresh-diza-whatsapp-codex-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    name: Build fresh Diza APK
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Reject WebView or browser UI
        shell: bash
        run: |
          if grep -R -n -E 'WebView|android\.webkit' android/app/src/main; then
            echo "WebView/browser UI is forbidden in the native Diza APK."
            exit 1
          fi

      - name: Build APK
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diza-fresh-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
