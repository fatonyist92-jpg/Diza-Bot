name: Android emulator smoke

on:
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "deploy/**"
      - "test/android-shell-contract.test.ts"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Boot DIZA APK in Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare local DIZA smoke server
        shell: bash
        run: |
          cat > /tmp/diza-smoke-server.mjs <<'EOF'
          import { createServer } from "node:http";
          const html = `<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>DIZA Smoke</title><body style="background:#000;color:#fff;font:20px sans-serif">
          <main id="diza-smoke">DIZA AI Personal Assistant</main>
          <script>history.pushState({diza:true}, "", "/home");</script></body>`;
          createServer((req,res) => {
            if (req.url === "/api/health") {
              res.writeHead(200, {"content-type":"application/json"});
              return res.end(JSON.stringify({ok:true}));
            }
            res.writeHead(200, {"content-type":"text/html; charset=utf-8"});
            res.end(html);
          }).listen(8788, "127.0.0.1");
          EOF
          node /tmp/diza-smoke-server.mjs >/tmp/diza-smoke-server.log 2>&1 &
          echo $! > /tmp/diza-smoke-server.pid

      - name: Boot emulator and launch DIZA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb reverse tcp:8788 tcp:8788
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.diza.personalai/.MainActivity
            sleep 6
            adb shell dumpsys activity activities | grep -q "com.diza.personalai/.MainActivity"
            adb shell pidof com.diza.personalai | grep -Eq "^[0-9]+"
            adb exec-out screencap -p > /tmp/diza-emulator.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell dumpsys activity activities | grep -q "com.diza.personalai/.MainActivity"

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIZA-emulator-smoke
          path: /tmp/diza-emulator.png
          if-no-files-found: ignore
