name: DIZA fetch current Faable logs once

on:
  push:
    branches:
      - logs-engine-live-20261003
    paths:
      - ".github/workflows/fetch-current-faable-logs.yml"

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - run: faable deploy status || true
      - run: faable deploy deployments || true
      - run: faable deploy logs || true
