name: DIZA runtime diagnose isolated

on:
  push:
    branches:
      - runtime-diagnose
    paths:
      - ".github/workflows/runtime-diagnose.yml"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: App status
        run: faable deploy status || true
      - name: Deployments
        run: faable deploy deployments || true
      - name: Build log
        run: faable deploy logs --build || true
      - name: Runtime log
        run: faable deploy logs || true
