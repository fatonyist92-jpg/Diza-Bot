name: DIZA Faable live secret bootstrap

on:
  push:
    branches:
      - live-test-bab14

permissions:
  contents: read
  id-token: write

jobs:
  set-live-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Faable CLI
        run: npm install -g @faable/faable@latest

      - name: Set private DIZA web credential
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')"
          echo "::add-mask::$password"

          faable deploy secrets set "DIZA_WEB_USERNAME=diza" "DIZA_WEB_PASSWORD=$password"

          printf '%s' "$password" > /tmp/diza-live-password.txt
          cat > /tmp/diza-live-secret-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyCJyhV5jlR5cALNrvaLq
          ZBg0Qw4/Hlw5sli/QeG93HHun2hzd+VWBRYhhgdklHZEqe+tTBfakb/z2kbcG84z
          /4yK1LfRyWO2RoVJlJqEWJYE3ixfqUPxXKubDtDYlTq0hYB0AKMsiHuRgKNPf470
          O3DRSVZJpgSL2IrCyntYE/JT1WsVMyAYAEWdiELJ3gKhgwSZsPLoDn89QeOnwNZb
          MP6uimhMgfFkrHHf1z44MTMxVlF5ySYNXL0C3nxf6XlDCyhl6p2VCIZx/RlWnal+
          cnfrl5jNX0ARGYjvz/6DkqJP0zmuYF75+dYHGtNUbu0shlN7kVnfrlfUF3/Z7Fsz
          OQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin \
            -inkey /tmp/diza-live-secret-public.pem \
            -in /tmp/diza-live-password.txt \
            -out /tmp/diza-live-password.enc
          rm -f /tmp/diza-live-password.txt

      - name: Store encrypted handoff briefly
        uses: actions/upload-artifact@v4
        with:
          name: diza-faable-live-password-encrypted
          path: /tmp/diza-live-password.enc
          retention-days: 1
          if-no-files-found: error
