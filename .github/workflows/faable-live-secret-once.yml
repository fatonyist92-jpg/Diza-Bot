name: DIZA Faable Supabase bootstrap

on:
  push:
    branches:
      - migration-vercel-supabase
    paths:
      - api/index.mjs
      - deploy/web.mjs
      - .github/workflows/faable-live-secret-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: Transfer the existing Supabase connection to Faable
        env:
          FAABLE_APP_ID: app_6abb421e39d8bf107f77ddb9
          # Pin the already-ready bridge deployment so the workflow does not
          # race the production alias while a later metadata-only commit builds.
          BRIDGE_URL: https://diza-mcalbvhc5-fatony1.vercel.app/api/__diza/faable-supabase-bootstrap
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Ffaable.com"
          github_oidc="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${oidc_url}" | jq -er '.value')"
          faable_token="$(jq -n --arg token "${github_oidc}" --arg app_id "${FAABLE_APP_ID}" '{token: $token, app_id: $app_id}' \
            | curl -fsS -H 'content-type: application/json' --data-binary @- https://api.faable.com/auth/github-oidc \
            | jq -er '.access_token')"
          echo "::add-mask::${faable_token}"

          database_url=''
          for attempt in $(seq 1 60); do
            database_url="$(curl -fsS -X POST -H "Authorization: Bearer ${faable_token}" "${BRIDGE_URL}" 2>/dev/null || true)"
            if [[ "${database_url}" == postgres://* || "${database_url}" == postgresql://* ]]; then
              break
            fi
            database_url=''
            sleep 5
          done
          test -n "${database_url}"
          echo "::add-mask::${database_url}"
          FAABLE_TOKEN="${faable_token}" faable deploy secrets set --app "${FAABLE_APP_ID}" "DATABASE_URL=${database_url}"
