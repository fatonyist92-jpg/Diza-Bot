name: DIZA BOT live acceptance

on:
  push:
    branches:
      - live-test-bab14
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diza-bot-live-test-bab14
  cancel-in-progress: true

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      MISTRAL_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      MOONSHOT_API_KEY: ""
      DIZA_USER_ACCESS_SHA256: "459f477ebf68a01fbbedfebfbc8bd0de3ca41b3f58b11911c0148ce6e5749317"

    steps:
      - name: Checkout live-test branch
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck and production build
        run: |
          pnpm typecheck
          pnpm build

      - name: Targeted live delta regression x3
        run: |
          for round in 1 2 3; do
            echo "Targeted regression round $round"
            node --experimental-strip-types --test               test/http-guard.test.ts               test/web-pairing-contract.test.ts               test/web-polling-fallback.test.ts               test/pwa-contract.test.ts               test/render-live-contract.test.ts               test/web-identity-contract.test.ts               test/imagine-temporary-fallback.test.ts               test/imagine-api.test.ts               test/reliability.test.ts
          done

      - name: Install and start free local Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            if ! pgrep -x ollama >/dev/null 2>&1; then
              nohup ollama serve >/tmp/ollama.log 2>&1 &
              echo $! >/tmp/ollama.pid
            fi
          fi
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Ollama did not become ready on 127.0.0.1:11434"
            cat /tmp/ollama.log 2>/dev/null || true
            ps aux | grep '[o]llama' || true
            exit 1
          fi
          ollama pull llama3.2
          ollama list

      - name: Seed private live access and remote mode
        shell: bash
        run: |
          verifier_token="diza_verify_$(openssl rand -hex 32)"
          echo "::add-mask::$verifier_token"
          verifier_hash="$(printf '%s' "$verifier_token" | sha256sum | awk '{print $1}')"
          export VERIFIER_HASH="$verifier_hash"
          mkdir -p "$HOME/.bloks"
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          config = {
              "setupDoneAt": int(time.time() * 1000),
              "remote": {
                  "enabled": True,
                  "devices": [
                      {
                          "id": "diza-live-user",
                          "name": "DIZA Live User",
                          "hash": os.environ["DIZA_USER_ACCESS_SHA256"],
                          "pairedAt": int(time.time() * 1000),
                      },
                      {
                          "id": "diza-live-verifier",
                          "name": "DIZA Live Verifier",
                          "hash": os.environ["VERIFIER_HASH"],
                          "pairedAt": int(time.time() * 1000),
                      },
                  ],
              },
          }
          path = Path.home() / ".bloks" / "config.json"
          path.write_text(json.dumps(config, indent=2))
          path.chmod(0o600)
          PY
          echo "VERIFIER_TOKEN=$verifier_token" >> "$GITHUB_ENV"

      - name: Start DIZA BOT
        shell: bash
        run: |
          nohup env             BLOKS_BIND_HOST=0.0.0.0             BLOKS_STATIC_DIR="$GITHUB_WORKSPACE/dist"             BLOKS_PORT=8799             node --experimental-strip-types server/index.ts >/tmp/diza.log 2>&1 &
          echo $! >/tmp/diza.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8799/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diza.log
          exit 1

      - name: Verify real local AI and temporary Imagine fallback
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:8799";
          const j = async (path, init) => {
            const r = await fetch(base + path, init);
            let body = null;
            try { body = await r.json(); } catch {}
            return { status: r.status, body };
          };
          let data = await j("/api/bots?messages=20");
          assert.equal(data.status, 200);
          const bot = data.body.bots[0];
          assert.ok(bot?.id);

          const image = await j(`/api/bots/${bot.id}/messages`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text: "Bikin gambar kucing astronaut" }),
          });
          assert.equal(image.status, 202);
          assert.equal(image.body.imagineTemporary, "image-generate");
          assert.equal(image.body.imagineJobId, undefined);

          const video = await j(`/api/bots/${bot.id}/messages`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text: "Buat video seekor kucing berjalan 5 detik" }),
          });
          assert.equal(video.status, 202);
          assert.equal(video.body.imagineTemporary, "text-to-video");
          assert.equal(video.body.imagineJobId, undefined);

          data = await j("/api/bots?messages=40");
          const before = new Set(data.body.bots[0].messages.map((m) => m.id));
          const sent = await j(`/api/bots/${bot.id}/messages`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text: "Balas singkat dengan teks: DIZA LIVE OK" }),
          });
          assert.equal(sent.status, 202);

          const until = Date.now() + 150000;
          let reply = null;
          while (Date.now() < until) {
            await new Promise((r) => setTimeout(r, 2000));
            const latest = await j("/api/bots?messages=60");
            const found = latest.body.bots[0];
            reply = found.messages.find((m) => !before.has(m.id) && m.role === "bot" && m.kind === "text" && String(m.text ?? "").trim());
            if (reply && !found.tasks.some((t) => t.state === "working")) break;
          }
          assert.ok(reply?.text, "Ollama produced no reply");
          console.log("LOCAL_REAL_AI_PASS", String(reply.text).slice(0, 160));
          NODE

      - name: Start HTTPS Quick Tunnel
        shell: bash
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8799 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          live_url=""
          for i in $(seq 1 90); do
            live_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            if [ -n "$live_url" ]; then break; fi
            sleep 1
          done
          if [ -z "$live_url" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "LIVE_URL=$live_url" >> "$GITHUB_ENV"
          echo "DIZA_LIVE_URL=$live_url"
          for i in $(seq 1 30); do
            if curl -fsS "$live_url/api/health" >/tmp/public-health.json; then
              cat /tmp/public-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Live browser acceptance round 1
        run: node scripts/live-verify.mjs

      - name: Restart backend and verify on-disk continuity
        shell: bash
        run: |
          kill "$(cat /tmp/diza.pid)"
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/diza.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          nohup env             BLOKS_BIND_HOST=0.0.0.0             BLOKS_STATIC_DIR="$GITHUB_WORKSPACE/dist"             BLOKS_PORT=8799             node --experimental-strip-types server/index.ts >>/tmp/diza.log 2>&1 &
          echo $! >/tmp/diza.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8799/api/health >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const response = await fetch("http://127.0.0.1:8799/api/bots?messages=100");
          assert.equal(response.status, 200);
          const data = await response.json();
          const messages = data.bots.flatMap((bot) => bot.messages ?? []);
          assert.ok(
            messages.some((message) => message.role === "user" && message.text === "Balas singkat dengan teks: DIZA LIVE OK"),
            "conversation did not survive backend restart",
          );
          console.log("RESTART_PERSISTENCE_PASS");
          NODE

      - name: Live browser acceptance round 2
        run: node scripts/live-verify.mjs

      - name: Live browser acceptance round 3
        run: node scripts/live-verify.mjs

      - name: Keep verified live-test endpoint available briefly
        shell: bash
        run: |
          echo "DIZA_LIVE_READY=$LIVE_URL"
          echo "Verified live-test window is open."
          sleep 900

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== DIZA SERVER ==="
          tail -200 /tmp/diza.log 2>/dev/null || true
          echo "=== OLLAMA ==="
          tail -100 /tmp/ollama.log 2>/dev/null || true
          echo "=== CLOUDFLARED ==="
          tail -100 /tmp/cloudflared.log 2>/dev/null || true
