name: DIZA set OpenRouter global once

on:
  push:
    branches:
      - migration-vercel-supabase
    paths:
      - ".github/workflows/set-openrouter-global-once.yml"

permissions:
  contents: read

jobs:
  set-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set global engine to OpenRouter free router
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://diza-bot.vercel.app";
          const botsRes = await fetch(base + "/api/bots?messages=0");
          if (!botsRes.ok) throw new Error("could not read bots");
          const bots = (await botsRes.json()).bots ?? [];
          const bot = bots.find((b) => b.name === "Diza") ?? bots.find((b) => !b.hidden) ?? bots[0];
          if (!bot?.id) throw new Error("no bot available to use the backward-compatible global engine route");
          const patch = await fetch(base + `/api/bots/${bot.id}`, {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              modelSelection: { instanceId: "openrouter", model: "openrouter/free" }
            }),
          });
          const body = await patch.text();
          if (!patch.ok) throw new Error(`engine patch failed ${patch.status}: ${body.slice(0,500)}`);
          const configRes = await fetch(base + "/api/config");
          const config = await configRes.json();
          if (config?.engine?.instanceId !== "openrouter" || config?.engine?.model !== "openrouter/free") {
            throw new Error("global engine did not switch to openrouter/free");
          }
          console.log("DIZA_GLOBAL_ENGINE_OPENROUTER_FREE_ROUTER=1");
          NODE
