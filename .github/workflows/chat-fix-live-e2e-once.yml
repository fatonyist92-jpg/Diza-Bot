name: DIZA chat-fix live E2E once

on:
  push:
    branches:
      - migration-vercel-supabase
    paths:
      - ".github/workflows/chat-fix-live-e2e-once.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live chat settles and OpenRouter no longer over-reserves output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://diza-bot.vercel.app";
          let botId = "";
          const j = async (path, init = {}) => {
            const response = await fetch(base + path, init);
            const text = await response.text();
            let body = {};
            try { body = JSON.parse(text); } catch { body = { text }; }
            if (!response.ok) throw new Error(`${init.method ?? "GET"} ${path} -> ${response.status}: ${text.slice(0,500)}`);
            return { body, text, headers: response.headers };
          };
          try {
            const made = await j("/api/bots", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ name: "__chat_fix_e2e__", title: "Temporary live verification" }),
            });
            botId = made.body?.bot?.id ?? "";
            if (!botId) throw new Error("temporary bot was not created");

            const before = new Set((made.body.bot.messages ?? []).map((m) => m.id));
            const streamed = await fetch(base + `/api/bots/${botId}/messages`, {
              method: "POST",
              headers: { "content-type": "application/json", accept: "text/event-stream" },
              body: JSON.stringify({ text: "Reply exactly OK", mode: "auto" }),
            });
            const wire = await streamed.text();
            if (!streamed.ok) throw new Error(`chat POST failed ${streamed.status}: ${wire.slice(0,500)}`);
            if (/request\.error/.test(wire)) throw new Error("stream returned request.error: " + wire.slice(-700));

            const state = await j("/api/bots?messages=30");
            const bot = (state.body.bots ?? []).find((b) => b.id === botId);
            if (!bot) throw new Error("temporary bot disappeared");
            if (bot.busy) throw new Error("bot remained busy after settled turn");
            const reply = (bot.messages ?? []).find((m) =>
              !before.has(m.id) && m.role === "bot" && m.kind === "text" && String(m.text ?? "").trim()
            );
            if (!reply) throw new Error("no settled assistant reply was persisted");
            const notices = (bot.messages ?? []).filter((m) =>
              !before.has(m.id) && m.role === "bot" && m.kind === "notice"
            );
            if (notices.some((m) => /HTTP 402|max_tokens|65535/i.test(String(m.text ?? "")))) {
              throw new Error("output reservation failure still present: " + notices.map((m) => m.text).join(" | ").slice(0,700));
            }
            console.log("DIZA_CHAT_FIX_LIVE_E2E_PASS=1");
            console.log("ENGINE=" + bot.modelSelection?.instanceId + "/" + bot.modelSelection?.model);
            console.log("REPLY=" + String(reply.text).slice(0,120));
          } finally {
            if (botId) {
              try { await fetch(base + `/api/bots/${botId}?forget=1`, { method: "DELETE" }); } catch {}
            }
          }
          NODE
