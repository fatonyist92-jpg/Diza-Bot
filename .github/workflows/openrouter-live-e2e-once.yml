name: DIZA OpenRouter live E2E once

on:
  push:
    branches:
      - migration-vercel-supabase
    paths:
      - ".github/workflows/openrouter-live-e2e-once.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live OpenRouter chat end to end
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://diza-bot.vercel.app";
          let botId = "";
          const j = async (path, init = {}) => {
            const res = await fetch(base + path, init);
            const text = await res.text();
            let body = {};
            try { body = JSON.parse(text); } catch { body = { text }; }
            if (!res.ok) throw new Error(`${init.method ?? "GET"} ${path} -> ${res.status}: ${text.slice(0,500)}`);
            return body;
          };
          try {
            const config = await j("/api/config");
            if (config?.engine?.instanceId !== "openrouter") throw new Error("global engine is not OpenRouter");
            if (config?.engine?.model !== "qwen/qwen3.8-27b:free") throw new Error("global model is not the free Qwen model");

            const made = await j("/api/bots", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                name: "__openrouter_e2e__",
                title: "Temporary live test",
                greeting: "Temporary engine verification bot."
              }),
            });
            botId = made?.bot?.id ?? "";
            if (!botId) throw new Error("temporary bot was not created");
            if (made?.bot?.modelSelection?.instanceId !== "openrouter") {
              throw new Error("temporary bot did not inherit global OpenRouter engine");
            }

            const before = new Set((made.bot.messages ?? []).map((m) => m.id));
            await j(`/api/bots/${botId}/messages`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ text: "Reply with exactly DIZA_OPENROUTER_LIVE_OK and nothing else. Do not call tools." }),
            });

            const deadline = Date.now() + 180000;
            let reply = null;
            while (Date.now() < deadline) {
              await new Promise((r) => setTimeout(r, 2500));
              const state = await j("/api/bots?messages=40");
              const bot = (state.bots ?? []).find((b) => b.id === botId);
              reply = (bot?.messages ?? []).find((m) =>
                !before.has(m.id) &&
                m.role === "bot" &&
                m.kind === "text" &&
                String(m.text ?? "").includes("DIZA_OPENROUTER_LIVE_OK")
              );
              if (reply) break;
            }
            if (!reply) throw new Error("OpenRouter live reply did not arrive before timeout");
            console.log("DIZA_OPENROUTER_LIVE_E2E_PASS=1");
            console.log("DIZA_REPLY=" + String(reply.text).slice(0,160));
          } finally {
            if (botId) {
              try {
                await fetch(base + `/api/bots/${botId}?forget=1`, { method: "DELETE" });
              } catch {}
            }
          }
          NODE
