name: CI

on:
  push:
    branches: [main, migration-vercel-supabase]
  pull_request:

# A newer push to the same branch makes the old run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # A lockfile that does not match package.json is its own bug, so
      # this fails rather than quietly resolving something different.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Smoke Termux gateway
        shell: bash
        run: |
          set -euo pipefail
          DIZA_START_HOSTC=0 DIZA_GATEWAY_PORT=8788 BLOKS_PORT=8799 node deploy/termux-hostc.mjs >/tmp/diza-termux-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true; cat /tmp/diza-termux-smoke.log' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8788/healthz >/tmp/diza-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          cat /tmp/diza-health.json || true
          test "$READY" = "1"
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/diza-health.json","utf8")); if(!data.ok || data.gateway!=="termux-hostc" || data.core!=="ready") process.exit(1)'

      - name: Check for stray build output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed tracked files. Something that should be"
            echo "ignored is committed, or generated output drifted:"
            git status --porcelain
            exit 1
          fi
