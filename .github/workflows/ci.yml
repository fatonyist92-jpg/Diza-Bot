name: CI

on:
  push:
    branches: [main, migration-vercel-supabase]
  pull_request:

# A newer push to the same branch makes the old run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # A lockfile that does not match package.json is its own bug, so
      # this fails rather than quietly resolving something different.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Start OpenRouter OAuth challenge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://diza-bot.vercel.app/api/oauth/openrouter/start" \
            -H 'content-type: application/json' \
            --data '{}' > /tmp/openrouter-oauth.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const x = JSON.parse(fs.readFileSync("/tmp/openrouter-oauth.json","utf8"));
          if (typeof x.url !== "string" || !x.url.startsWith("https://openrouter.ai/")) {
            throw new Error("live DIZA did not return an OpenRouter OAuth URL");
          }
          console.log("OPENROUTER_OAUTH_CHALLENGE_READY=1");
          NODE

      - name: Store private OpenRouter OAuth challenge
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-oauth-challenge
          path: /tmp/openrouter-oauth.json
          retention-days: 1
          if-no-files-found: error

      - name: Check for stray build output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed tracked files. Something that should be"
            echo "ignored is committed, or generated output drifted:"
            git status --porcelain
            exit 1
          fi
