name: DIZA Faable persistence secret bootstrap once

on:
  push:
    branches:
      - faable-diagnose-20261002
    paths:
      - ".github/workflows/faable-persistence-secret-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: Generate and install Faable persistence credentials
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          hash="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          faable deploy secrets set             "DIZA_PERSIST_TOKEN=$token"             "DIZA_PERSIST_API_URL=https://wblxwdrlsicdgtcghfmk.supabase.co"             "SUPABASE_PUBLISHABLE_KEY=sb_publishable_0Snl287NKE7r9Czkg7R1CA_lFmVYIMA"
          echo "DIZA_PERSIST_TOKEN_SHA256=$hash"
