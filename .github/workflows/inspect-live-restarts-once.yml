name: DIZA inspect live restarts once

on:
  push:
    branches:
      - inspect-live-restarts-20261003
    paths:
      - ".github/workflows/inspect-live-restarts-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @faable/faable@latest
      - name: Inspect current deployment
        run: faable deploy inspect deployment_6ac07b3a13dbdf42cbaf758c || true
      - name: Runtime logs
        run: faable deploy logs || true
